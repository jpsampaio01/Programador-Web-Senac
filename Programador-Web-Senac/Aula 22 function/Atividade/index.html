<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora</title>

    <!-- Conectando o CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Calculadora</h1>

        <p>Digite dois números:</p>


        <!-- Primeiro número -->

        <input
            type="number"
            id="numero1"
            placeholder="Digite o primeiro número"
        >


        <!-- Segundo número -->

        <input
            type="number"
            id="numero2"
            placeholder="Digite o segundo número"
        >


        <!-- Botões -->

        <div class="botoes">

            <button onclick="calcularSoma()">
                Soma (+)
            </button>

            <button onclick="calcularSubtracao()">
                Subtração (-)
            </button>

            <button onclick="calcularDivisao()">
                Divisão (/)
            </button>

            <button onclick="calcularMultiplicacao()">
                Multiplicação (*)
            </button>

            <button onclick="calcularResto()">
                Resto (%)
            </button>

        </div>


        <!-- Resultado -->

        <h2 id="resultado">
            Resultado:
        </h2>

    </div>


    <!-- Conectando o JavaScript -->

    <script src="script.js"></script>

</body>

</html>
